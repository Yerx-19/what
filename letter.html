<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10182b">
<title>A Letter for BaoBao</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#fff4d2;background:radial-gradient(ellipse at 50% 38%,#263b5b 0%,#14233c 45%,#080e1b 100%)}
  .stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(1px 1px at 12% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 78% 18%,#f7d98d 98%,transparent),radial-gradient(1px 1px at 66% 74%,#fff 98%,transparent),radial-gradient(1px 1px at 24% 82%,#d9eaff 98%,transparent),radial-gradient(1px 1px at 91% 55%,#fff 98%,transparent);background-size:310px 280px;opacity:.5;animation:twinkle 5s ease-in-out infinite alternate}
  .stars:before{transform:translate(30px,20px);opacity:.35;animation-delay:-2s}.stars:after{transform:translate(-20px,-15px);opacity:.25;animation-delay:-3s}
  @keyframes twinkle{from{opacity:.2}to{opacity:.65}}
  .scene{position:relative;width:min(92vw,620px);height:min(78vh,540px);display:grid;place-items:center;perspective:1200px}
  .intro{position:absolute;top:7%;width:100%;text-align:center;transition:opacity .6s ease,transform .6s ease}
  h1{margin:0 0 12px;font-size:clamp(1.65rem,5vw,2.65rem);font-weight:normal;letter-spacing:.045em;color:#fff0c3;text-shadow:0 0 22px #e7bf6c55}
  .intro p{margin:0;color:#d9e4f5;font:500 .9rem/1.6 'Segoe UI',sans-serif;letter-spacing:.08em}
  .envelope-wrap{position:relative;width:min(76vw,390px);height:min(49vw,250px);min-height:175px;cursor:pointer;filter:drop-shadow(0 24px 30px #0008);transform:translateY(38px);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
  .envelope-wrap:hover{transform:translateY(32px) scale(1.025)}
  .envelope{position:absolute;inset:0;border-radius:8px;background:linear-gradient(145deg,#f9e8c5,#dfc18f);overflow:visible}
  .envelope:before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(35deg,transparent 49.5%,#c9a873 50%,transparent 50.6%),linear-gradient(-35deg,transparent 49.5%,#d7b985 50%,transparent 50.6%);z-index:3;pointer-events:none}
  .pocket{position:absolute;inset:0;background:linear-gradient(145deg,#f4dfb6,#d5b17b);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px;z-index:4}
  .flap{position:absolute;inset:0 0 auto;height:65%;background:linear-gradient(160deg,#ffedcc,#d9b982);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transform:rotateX(0);transition:transform 1s cubic-bezier(.2,.7,.2,1);z-index:5;backface-visibility:visible}
  .seal{position:absolute;z-index:6;left:50%;top:51%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f7d98e,#a96d37);color:#fff4d2;font-size:22px;box-shadow:0 3px 9px #70421d66;transition:opacity .3s ease,transform .4s ease}
  .letter-paper{position:absolute;left:7%;right:7%;bottom:7%;height:84%;padding:25px 20px;background:linear-gradient(#fffaf0,#f1e3c8);color:#80613c;text-align:center;border-radius:4px;z-index:2;transform:translateY(0);transition:transform 1.1s .35s cubic-bezier(.2,.8,.2,1),height 1s .35s ease}
  .paper-title{font-size:clamp(1.2rem,4vw,1.65rem);font-style:italic;margin:18px 0 8px}.paper-line{width:45px;height:1px;background:#c8a56d;margin:13px auto}.paper-note{font: .76rem/1.7 'Segoe UI',sans-serif;letter-spacing:.04em;color:#9b805c}
  .hint{position:absolute;bottom:4%;width:100%;text-align:center;color:#c7d4e8;font: .82rem 'Segoe UI',sans-serif;letter-spacing:.07em;opacity:.9;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.48}}
  .scene.opening .intro{opacity:0;transform:translateY(-16px)}
  .scene.opening .flap{transform:rotateX(180deg);z-index:7}
  .scene.opening .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  .scene.opening .letter-paper{transform:translateY(-105px);height:100%}
  .scene.opening .envelope-wrap{transform:translateY(38px) scale(1.08)}
  .scene.leaving{animation:fadeAway .9s ease forwards}
  @keyframes fadeAway{to{opacity:0;transform:scale(1.04);filter:blur(5px)}}
  .open-btn{position:absolute;inset:0;z-index:10;border:0;background:transparent;cursor:pointer;border-radius:8px}
  .open-btn:focus-visible{outline:3px solid #fff0c3;outline-offset:8px}
  .fallback{position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:1px solid #e6c77f66;background:#101b30aa;color:#f7e7bd;padding:9px 15px;border-radius:999px;font: .8rem 'Segoe UI',sans-serif;text-decoration:none;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
  .scene.opening .fallback{opacity:1;pointer-events:auto;transition-delay:1.2s}
  @media(max-width:480px){.scene{height:75vh}.intro{top:10%}.envelope-wrap{transform:translateY(20px)}.scene.opening .envelope-wrap{transform:translateY(20px) scale(1.04)}.hint{bottom:9%}.scene.opening .letter-paper{transform:translateY(-80px)}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="scene" id="scene">
  <div class="intro"><h1>A little letter for you</h1><p>MADE WITH LOVE, JUST FOR BAOBAO</p></div>
  <div class="envelope-wrap" aria-label="Sealed birthday letter">
    <div class="envelope">
      <div class="letter-paper"><div class="paper-title">For BaoBao</div><div class="paper-line"></div><div class="paper-note">There's something special waiting inside…</div></div>
      <div class="pocket"></div><div class="flap"></div><div class="seal">✦</div>
      <button class="open-btn" id="openLetter" aria-label="Open the letter"></button>
    </div>
  </div>
  <div class="hint" id="hint">TAP THE LETTER TO OPEN</div>
  <a class="fallback" href="index.html">Continue to the bouquet →</a>
</main>
<script>
  const scene=document.getElementById('scene');
  const openButton=document.getElementById('openLetter');
  let opened=false;
  function openLetter(){
    if(opened)return;
    opened=true;
    scene.classList.add('opening');
    document.getElementById('hint').textContent='A LITTLE SURPRISE IS WAITING…';
    window.setTimeout(()=>scene.classList.add('leaving'),2100);
    window.setTimeout(()=>{window.location.href='index.html';},2850);
  }
  openButton.addEventListener('click',openLetter);
  document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter();}});
</script>
</body>
</html>
