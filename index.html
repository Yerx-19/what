
<svg class="real-bouquet" viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="roseBlue" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#477bb5"/>
      <stop offset="45%" stop-color="#163f78"/>
      <stop offset="100%" stop-color="#061b3b"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6392c4"/>
      <stop offset=".45" stop-color="#17477f"/>
      <stop offset="1" stop-color="#061a39"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0b5"/>
      <stop offset=".5" stop-color="#c69a42"/>
      <stop offset="1" stop-color="#80551c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c32"/>
      <stop offset=".5" stop-color="#030914"/>
      <stop offset="1" stop-color="#253954"/>
    </linearGradient>
    <radialGradient id="crystal">
      <stop stop-color="white"/>
      <stop offset=".3" stop-color="#dff3ff"/>
      <stop offset=".65" stop-color="#9cb8d6"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Layered navy rose -->
    <g id="rose">
      <circle r="39" fill="#071a36"/>
      <g fill="url(#petal)" stroke="#7296bf" stroke-opacity=".25" stroke-width="1.2">
        <ellipse cy="-17" rx="14" ry="23"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(45)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(90)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(135)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(180)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(225)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(270)"/>
        <ellipse cy="-17" rx="14" ry="23" transform="rotate(315)"/>
      </g>
      <g fill="url(#roseBlue)" stroke="#7397c3" stroke-opacity=".45">
        <ellipse cy="-10" rx="11" ry="17" transform="rotate(20)"/>
        <ellipse cy="-10" rx="11" ry="17" transform="rotate(110)"/>
        <ellipse cy="-10" rx="11" ry="17" transform="rotate(200)"/>
        <ellipse cy="-10" rx="11" ry="17" transform="rotate(290)"/>
      </g>
      <path d="M-8 2 Q-15 -12 0 -18 Q17 -10 9 4 Q3 13 -5 10 Q-12 5 -3 -2 Q5 -9 8 -2"
            fill="none" stroke="#8db3df" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="9" fill="url(#crystal)"/>
      <circle cx="-3" cy="-3" r="2.5" fill="white"/>
    </g>

    <!-- Baby's breath flowers -->
    <g id="baby">
      <path d="M0 0 Q-10 -25 5 -48 M0 -5 Q15 -22 23 -35 M0 -14 Q-18 -27 -24 -38"
            fill="none" stroke="#829d82" stroke-width="2"/>
      <g fill="#fff" stroke="#e7edf3" stroke-width=".7">
        <circle cx="5" cy="-48" r="5"/>
        <circle cx="23" cy="-35" r="5"/>
        <circle cx="-24" cy="-38" r="5"/>
        <circle cx="-10" cy="-25" r="4"/>
        <circle cx="12" cy="-23" r="4"/>
        <circle cx="0" cy="-14" r="4"/>
      </g>
      <g fill="#fff9e8">
        <circle cx="5" cy="-48" r="2"/>
        <circle cx="23" cy="-35" r="2"/>
        <circle cx="-24" cy="-38" r="2"/>
      </g>
    </g>

    <!-- Decorative butterfly -->
    <g id="butterfly">
      <path d="M0 0 C-12 -34 -45 -48 -35 -12 C-28 7 -12 12 0 0
               C12 -34 45 -48 35 -12 C28 7 12 12 0 0
               C-15 10 -25 38 -8 34 L0 0
               C15 10 25 38 8 34 Z"
            fill="url(#gold)" stroke="#fff0bd" stroke-width="2"/>
      <path d="M0 -5 L0 24 M0 -5 Q-10 -22 -16 -20 M0 -5 Q10 -22 16 -20"
            stroke="#fff3c5" stroke-width="2" fill="none"/>
      <path d="M-27 -17 L-8 -5 M27 -17 L8 -5"
            stroke="#77521c" stroke-width="1.5" fill="none"/>
    </g>
  </defs>

  <!-- Bouquet shadow -->
  <ellipse cx="250" cy="505" rx="150" ry="20" fill="#07172c" opacity=".18" filter="url(#shadow)"/>

  <!-- Black and gold wrapping paper -->
  <path d="M250 470 L30 260 Q45 110 115 45 L225 165
           L250 15 L365 155 L450 65 Q500 170 470 300 Z"
        fill="url(#paper)" stroke="#c8a65d" stroke-width="6"/>
  <path d="M250 465 L15 300 Q-5 260 12 235 L135 280
           L250 30 L365 280 L490 230 Q510 270 480 315 Z"
        fill="#0b1930" stroke="#d3b16b" stroke-width="5"/>

  <!-- Stems -->
  <g stroke="#496f50" stroke-width="6" fill="none" opacity=".9">
    <path d="M245 280 Q230 390 250 495"/>
    <path d="M210 270 Q195 390 245 490"/>
    <path d="M280 260 Q300 390 260 490"/>
    <path d="M180 290 Q205 410 245 490"/>
    <path d="M320 285 Q285 400 260 490"/>
  </g>

  <!-- Leaves -->
  <g fill="#426d51" stroke="#8eae84" stroke-width="1">
    <path d="M205 365 Q135 320 130 365 Q165 405 205 365"/>
    <path d="M285 380 Q355 320 375 365 Q335 415 285 380"/>
    <path d="M230 420 Q160 385 165 425 Q205 455 230 420"/>
    <path d="M275 430 Q350 380 360 425 Q315 460 275 430"/>
  </g>

  <!-- Roses: back row -->
  <use href="#rose" transform="translate(150 185) scale(.85)"/>
  <use href="#rose" transform="translate(220 145) scale(.85)"/>
  <use href="#rose" transform="translate(295 155) scale(.9)"/>
  <use href="#rose" transform="translate(365 195) scale(.85)"/>

  <!-- Middle row -->
  <use href="#rose" transform="translate(105 270) scale(.95)"/>
  <use href="#rose" transform="translate(185 235) scale(1.05)"/>
  <use href="#rose" transform="translate(270 245) scale(1.05)"/>
  <use href="#rose" transform="translate(355 270) scale(.95)"/>
  <use href="#rose" transform="translate(410 290) scale(.8)"/>

  <!-- Front row -->
  <use href="#rose" transform="translate(145 355) scale(.9)"/>
  <use href="#rose" transform="translate(225 340) scale(1.05)"/>
  <use href="#rose" transform="translate(305 355) scale(1)"/>
  <use href="#rose" transform="translate(365 365) scale(.85)"/>

  <!-- Baby's breath -->
  <use href="#baby" transform="translate(95 215) scale(1.2)"/>
  <use href="#baby" transform="translate(175 115) scale(1.1)"/>
  <use href="#baby" transform="translate(340 110) scale(1.2)"/>
  <use href="#baby" transform="translate(410 225) scale(1.1)"/>
  <use href="#baby" transform="translate(85 330) scale(1)"/>
  <use href="#baby" transform="translate(410 345) scale(1)"/>
  <use href="#baby" transform="translate(185 420) scale(1.1)"/>
  <use href="#baby" transform="translate(320 425) scale(1.1)"/>

  <!-- Gold butterflies -->
  <use href="#butterfly" transform="translate(205 175) scale(1.05) rotate(-18)"/>
  <use href="#butterfly" transform="translate(335 330) scale(1.2) rotate(15)"/>

  <!-- Final wrapping fold -->
  <path d="M70 385 Q250 445 430 385 L390 520 Q250 550 110 520 Z"
        fill="url(#paper)" stroke="#c6a35f" stroke-width="5"/>
  <path d="M110 510 Q250 535 390 510" fill="none" stroke="#d8b86e" stroke-width="3"/>

  <!-- Blue satin bow -->
  <g transform="translate(250 470)">
    <path d="M0 0 Q-80 -70 -100 -15 Q-80 40 0 8"
          fill="#174b83" stroke="#8eb6dd" stroke-width="3"/>
    <path d="M0 0 Q80 -70 100 -15 Q80 40 0 8"
          fill="#245c96" stroke="#8eb6dd" stroke-width="3"/>
    <path d="M-12 0 L-48 75 L-10 58 L0 5
             L12 0 L48 75 L10 58 Z"
          fill="#174b83" stroke="#8eb6dd" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="17" ry="15" fill="url(#gold)"/>
  </g>
</svg>
