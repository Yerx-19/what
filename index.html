
<section class="ascii-art">
    <div class="ascii-title">
        A FLOWER MADE OF A THOUSAND CHARACTERS
    </div>

    <div class="terminal">
        <canvas id="asciiFlower"></canvas>
    </div>

    <p class="ascii-caption">
        "Send this to your favorite person 💗"
    </p>
</section>

<style>
.ascii-art {
    padding: 50px 15px;
    text-align: center;
}

.ascii-title {
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: #7fae9a;
    margin-bottom: 20px;
}

.terminal {
    background: #020403;
    border: 1px solid #233a31;
    border-radius: 12px;
    overflow: hidden;
    width: min(100%, 700px);
    margin: auto;
    box-shadow: 0 0 35px #123d2830;
}

#asciiFlower {
    display: block;
    width: 100%;
    height: auto;
}

.ascii-caption {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 22px;
    background: #f4df32;
    color: #202016;
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: bold;
    border-radius: 5px;
}
</style>

<script>
(() => {
    const canvas = document.getElementById("asciiFlower");
    const ctx = canvas.getContext("2d");

    const W = 100;
    const H = 52;

    canvas.width = W * 9;
    canvas.height = H * 13;

    const chars = "01{}[]<>/\\|:;*+abcdefghijklmnopqrstuvwxyz";
    const redChars = "0189@#$%&";
    const greenChars = "01{}[]/\\|+*";

    let frame = 0;

    // Flower head positions
    const roses = [
        [25, 16, 10, 7],
        [38, 12, 11, 8],
        [52, 13, 11, 8],
        [67, 17, 10, 7],
        [44, 22, 12, 7],
        [59, 24, 10, 7],
        [30, 25, 9, 6]
    ];

    function ellipse(x, y, cx, cy, rx, ry) {
        return ((x-cx)/rx)**2 + ((y-cy)/ry)**2 <= 1;
    }

    function random(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
    }

    function draw() {
        frame++;

        ctx.fillStyle = "#020403";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "10px monospace";
        ctx.textBaseline = "top";

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {

                const r = random(x, y);
                const flicker = Math.sin(frame * .06 + x + y) * .5 + .5;

                let color = null;
                let character = chars[Math.floor(r * chars.length)];

                // STARS
                if (r > .985) {
                    color = `rgba(220,245,255,${.3 + flicker*.7})`;
                    character = r > .994 ? "✦" : ".";
                }

                // ROSE PETALS
                for (let i = 0; i < roses.length; i++) {
                    const [cx, cy, rx, ry] = roses[i];

                    if (ellipse(x,y,cx,cy,rx,ry)) {
                        color = r > .65 ? "#ff426d" :
                                r > .3 ? "#a91745" : "#65132e";

                        character = redChars[
                            Math.floor(r * redChars.length)
                        ];
                    }

                    // Inner flower details
                    if (ellipse(x,y,cx,cy,rx*.43,ry*.43)) {
                        color = "#ff7792";
                        character = "{}*"[Math.floor(r*3)];
                    }
                }

                // STEMS
                const stemX = 48 + Math.sin(y*.25)*3;

                if (y > 27 && y < 47 && Math.abs(x-stemX) < 2) {
                    color = "#39d96c";
                    character = greenChars[
                        Math.floor(r*greenChars.length)
                    ];
                }

                // LEAVES
                const leaves = [
                    [35,32,12,4],
                    [61,34,13,4],
                    [39,39,10,3],
                    [57,41,11,3],
                    [25,36,8,3],
                    [70,38,8,3]
                ];

                for (const [cx,cy,rx,ry] of leaves) {
                    if (ellipse(x,y,cx,cy,rx,ry)) {
                        color = r > .5 ? "#43ed70" : "#168b49";
                        character = greenChars[
                            Math.floor(r*greenChars.length)
                        ];
                    }
                }

                // FLOWER STEM BOTTOM
                if (y >= 45 && y <= 50 && x >= 45 && x <= 51) {
                    color = "#28ba60";
                    character = greenChars[
                        Math.floor(r*greenChars.length)
                    ];
                }

                if (color) {
                    ctx.fillStyle = color;
                    ctx.fillText(
                        character,
                        x*9,
                        y*13
                    );
                }
            }
        }

        requestAnimationFrame(draw);
    }

    draw();
})();
</script>
