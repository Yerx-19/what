<header class="birthday-header">
    <div class="header-decoration">✦</div>
    <h1>Happy Birthday BaoBao!</h1>
    <p>A special bouquet, made just for you 💙</p>
    <div class="header-line"></div>
</header>

<svg class="real-bouquet" viewBox="0 0 500 560"
xmlns="http://www.w3.org/2000/svg">

<defs>
<radialGradient id="roseBlue">
  <stop offset="0%" stop-color="#477bb5"/>
  <stop offset="50%" stop-color="#163f78"/>
  <stop offset="100%" stop-color="#061b3b"/>
</radialGradient>

<linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#6392c4"/>
  <stop offset=".5" stop-color="#17477f"/>
  <stop offset="1" stop-color="#061a39"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fff0b5"/>
  <stop offset=".5" stop-color="#c69a42"/>
  <stop offset="1" stop-color="#80551c"/>
</linearGradient>

<radialGradient id="crystal">
  <stop stop-color="white"/>
  <stop offset=".5" stop-color="#dff3ff"/>
  <stop offset="1" stop-color="#8baacb"/>
</radialGradient>

<g id="rose">
  <circle r="38" fill="#071a36"/>

  <g fill="url(#petal)" stroke="#7296bf" stroke-opacity=".3">
    <ellipse cy="-17" rx="14" ry="23"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(45)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(90)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(135)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(180)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(225)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(270)"/>
    <ellipse cy="-17" rx="14" ry="23" transform="rotate(315)"/>
  </g>

  <g fill="url(#roseBlue)">
    <ellipse cy="-10" rx="11" ry="17"/>
    <ellipse cy="-10" rx="11" ry="17" transform="rotate(90)"/>
    <ellipse cy="-10" rx="11" ry="17" transform="rotate(180)"/>
    <ellipse cy="-10" rx="11" ry="17" transform="rotate(270)"/>
  </g>

  <path d="M-8 2 Q-15 -12 0 -18 Q17 -10 9 4 Q3 13 -5 10 Q-12 5 -3 -2"
        fill="none" stroke="#8db3df" stroke-width="4"/>

  <circle r="9" fill="url(#crystal)"/>
  <circle cx="-3" cy="-3" r="2.5" fill="white"/>
</g>

<g id="baby">
  <path d="M0 0 Q-10 -25 5 -48 M0 -5 Q15 -22 23 -35 M0 -14 Q-18 -27 -24 -38"
        fill="none" stroke="#829d82" stroke-width="2"/>
  <g fill="white">
    <circle cx="5" cy="-48" r="5"/>
    <circle cx="23" cy="-35" r="5"/>
    <circle cx="-24" cy="-38" r="5"/>
    <circle cx="-10" cy="-25" r="4"/>
    <circle cx="12" cy="-23" r="4"/>
    <circle cx="0" cy="-14" r="4"/>
  </g>
</g>

<g id="butterfly">
  <path d="M0 0 C-12 -34 -45 -48 -35 -12 C-28 7 -12 12 0 0
  C12 -34 45 -48 35 -12 C28 7 12 12 0 0
  C-15 10 -25 38 -8 34 L0 0
  C15 10 25 38 8 34 Z"
  fill="url(#gold)" stroke="#fff0bd" stroke-width="2"/>
  <path d="M0 -5 L0 24 M0 -5 Q-10 -22 -16 -20 M0 -5 Q10 -22 16 -20"
        stroke="#fff3c5" stroke-width="2" fill="none"/>
</g>
</defs>

<!-- Stems -->
<g stroke="#496f50" stroke-width="6" fill="none">
  <path d="M245 280 Q230 390 250 495"/>
  <path d="M210 270 Q195 390 245 490"/>
  <path d="M280 260 Q300 390 260 490"/>
  <path d="M180 290 Q205 410 245 490"/>
  <path d="M320 285 Q285 400 260 490"/>
</g>

<!-- Greenery -->
<g fill="#426d51" stroke="#8eae84">
  <path d="M205 365 Q135 320 130 365 Q165 405 205 365"/>
  <path d="M285 380 Q355 320 375 365 Q335 415 285 380"/>
  <path d="M230 420 Q160 385 165 425 Q205 455 230 420"/>
  <path d="M275 430 Q350 380 360 425 Q315 460 275 430"/>
</g>

<!-- Back row roses -->
<use href="#rose" transform="translate(105 195) scale(.8)"/>
<use href="#rose" transform="translate(165 150) scale(.85)"/>
<use href="#rose" transform="translate(235 135) scale(.9)"/>
<use href="#rose" transform="translate(305 150) scale(.85)"/>
<use href="#rose" transform="translate(375 195) scale(.8)"/>

<!-- Second row -->
<use href="#rose" transform="translate(85 265) scale(.9)"/>
<use href="#rose" transform="translate(155 235) scale(1)"/>
<use href="#rose" transform="translate(235 215) scale(1)"/>
<use href="#rose" transform="translate(315 235) scale(1)"/>
<use href="#rose" transform="translate(395 265) scale(.9)"/>

<!-- Third row -->
<use href="#rose" transform="translate(105 340) scale(.9)"/>
<use href="#rose" transform="translate(180 310) scale(1)"/>
<use href="#rose" transform="translate(255 305) scale(1.05)"/>
<use href="#rose" transform="translate(330 315) scale(1)"/>
<use href="#rose" transform="translate(400 340) scale(.9)"/>

<!-- Front row -->
<use href="#rose" transform="translate(145 400) scale(.8)"/>
<use href="#rose" transform="translate(215 385) scale(.9)"/>
<use href="#rose" transform="translate(285 390) scale(.9)"/>
<use href="#rose" transform="translate(355 405) scale(.8)"/>

<!-- Extra baby's breath -->
<use href="#baby" transform="translate(70 220) scale(1.2)"/>
<use href="#baby" transform="translate(135 110) scale(1.2)"/>
<use href="#baby" transform="translate(205 95) scale(1.1)"/>
<use href="#baby" transform="translate(330 105) scale(1.2)"/>
<use href="#baby" transform="translate(425 215) scale(1.2)"/>
<use href="#baby" transform="translate(65 320) scale(1)"/>
<use href="#baby" transform="translate(435 320) scale(1)"/>
<use href="#baby" transform="translate(170 435) scale(1.1)"/>
<use href="#baby" transform="translate(330 435) scale(1.1)"/>

<!-- Gold butterflies -->
<use href="#butterfly" transform="translate(195 175) scale(1.05) rotate(-18)"/>
<use href="#butterfly" transform="translate(340 335) scale(1.2) rotate(15)"/>

<!-- Black and gold wrapping -->
<path d="M250 470 L30 260 Q45 110 115 45 L225 165
L250 15 L365 155 L450 65 Q500 170 470 300 Z"
fill="#111c30" stroke="#c8a65d" stroke-width="6"/>

<path d="M70 385 Q250 445 430 385 L390 520 Q250 550 110 520 Z"
fill="#101b30" stroke="#d3b16b" stroke-width="5"/>

<!-- Satin bow -->
<g transform="translate(250 470)">
  <path d="M0 0 Q-80 -70 -100 -15 Q-80 40 0 8"
        fill="#174b83" stroke="#8eb6dd" stroke-width="3"/>
  <path d="M0 0 Q80 -70 100 -15 Q80 40 0 8"
        fill="#245c96" stroke="#8eb6dd" stroke-width="3"/>
  <path d="M-12 0 L-48 75 L-10 58 L0 5
           L12 0 L48 75 L10 58 Z"
        fill="#174b83" stroke="#8eb6dd" stroke-width="2"/>
  <ellipse rx="17" ry="15" fill="url(#gold)"/>
</g>
</svg>
