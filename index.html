<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday BaoBao!</title>
  <style>
    :root {
      --bg-top: #070d18;
      --bg-mid: #0d182b;
      --bg-bot: #060a13;
      --gold-light: #fff3c4;
      --gold-mid: #f2c96b;
      --gold-deep: #b8872d;
      --sky-soft: #bae6fd;
      --panel-bg: rgba(11, 20, 38, 0.78);
      --panel-border: rgba(242, 201, 107, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #142544 0%, var(--bg-mid) 46%, var(--bg-bot) 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient floating sparkles */
    .sparkle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      animation: floatTwinkle var(--dur, 6s) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes floatTwinkle {
      0%, 100% {
        transform: translateY(0) scale(0.6);
        opacity: 0;
      }
      50% {
        transform: translateY(-28px) scale(1.2);
        opacity: 0.85;
      }
    }

    /* Main layout */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 14px;
    }

    /* Hero Header */
    header.hero-header {
      text-align: center;
      z-index: 5;
      pointer-events: none;
      padding-top: 2px;
    }

    header.hero-header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.35rem, 3.3vw, 2.35rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(120deg, #fff8dc 0%, #f7d674 32%, #ffffff 52%, #e3b34c 78%, #fff1b8 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 26px rgba(242, 201, 107, 0.35);
      animation: shimmerText 5s linear infinite;
    }

    @keyframes shimmerText {
      to {
        background-position: 220% center;
      }
    }

    /* ASCII Viewport */
    .stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      overflow: hidden;
      touch-action: none;
    }

    .stage-wrap:active {
      cursor: grabbing;
    }

    pre#ascii-canvas {
      font-family: 'Cascadia Mono', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: clamp(2.65px, 0.56vh, 4.35px);
      line-height: 0.92;
      letter-spacing: 0.04em;
      white-space: pre;
      text-align: center;
      transform-origin: center center;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 12px 32px rgba(3, 8, 20, 0.85));
    }

    /* Bottom Control Bar & Music Pill */
    .controls-bar {
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .btn {
      background: rgba(255, 255, 255, 0.07);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      background: rgba(242, 201, 107, 0.2);
      border-color: rgba(242, 201, 107, 0.55);
      color: #fff8dc;
    }

    .btn.music-btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(242, 201, 107, 0.24));
      border-color: rgba(242, 201, 107, 0.5);
      color: #fef3c7;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
    }

    .hint-tag {
      font-size: 0.7rem;
      color: rgba(203, 213, 225, 0.75);
      padding: 0 4px;
    }

    /* Hidden YouTube iframe for background audio */
    #yt-player-holder {
      position: fixed;
      width: 1px;
      height: 1px;
      bottom: 0;
      right: 0;
      opacity: 0.01;
      pointer-events: none;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      pre#ascii-canvas {
        font-size: clamp(2.15px, 0.68vw, 3.2px);
      }
      .hint-tag {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="sparkle-layer" id="sparkles"></div>

  <div class="app-shell">
    <header class="hero-header">
      <h1>Happy Birthday BaoBao!</h1>
    </header>

    <main class="stage-wrap" id="stage">
      <pre id="ascii-canvas" aria-label="3D Rotating ASCII Flower Bouquet"></pre>
    </main>

    <div class="controls-bar">
      <button class="btn" id="toggle-spin">⏸ Pause</button>
      <button class="btn" id="speed-btn">Speed: 1x</button>
      <button class="btn" id="zoom-btn">Zoom: 1x</button>
      <div class="divider"></div>
      <button class="btn music-btn" id="music-toggle">🔊 Play Birthday Song</button>
      <span class="hint-tag">Drag sideways to spin · Up/down to view top</span>
    </div>
  </div>

  <div id="yt-player-holder">
    <div id="yt-player"></div>
  </div>

  <script>
    // =========================================================
    // 1. AMBIENT SPARKLES
    // =========================================================
    (function initSparkles() {
      const container = document.getElementById('sparkles');
      const colors = ['#fde68a', '#bae6fd', '#ffffff', '#f59e0b', '#7dd3fc'];
      for (let i = 0; i < 42; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const size = (Math.random() * 3 + 1.5).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.top = (Math.random() * 100).toFixed(2) + '%';
        s.style.background = colors[i % colors.length];
        s.style.boxShadow = `0 0 ${size * 3}px ${colors[i % colors.length]}`;
        s.style.setProperty('--dur', (Math.random() * 5 + 4).toFixed(2) + 's');
        s.style.animationDelay = (Math.random() * 6).toFixed(2) + 's';
        container.appendChild(s);
      }
    })();

    // =========================================================
    // 2. YOUTUBE AUTOPLAY (requested YouTube Music track)
    // =========================================================
    let ytPlayer = null;
    let isPlaying = false;
    let isMuted = false;
    const musicBtn = document.getElementById('music-toggle');

    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: 'GnUW4AF1LZo', // Requested YouTube Music track
        playerVars: {
          autoplay: 1,
          controls: 0,
          loop: 1,
          playlist: 'GnUW4AF1LZo',
          playsinline: 1
        },
        events: {
          onReady: function (event) {
            event.target.setVolume(80);
            event.target.playVideo();
            setTimeout(() => {
              if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                const state = ytPlayer.getPlayerState();
                if (state !== 1) {
                  event.target.mute();
                  event.target.playVideo();
                  isMuted = true;
                  updateMusicLabel();
                } else {
                  isPlaying = true;
                  isMuted = false;
                  updateMusicLabel();
                }
              }
            }, 900);
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              updateMusicLabel();
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              updateMusicLabel();
            }
          }
        }
      });
    };

    function updateMusicLabel() {
      if (!isPlaying) {
        musicBtn.textContent = '▶ Play Song';
      } else if (isMuted) {
        musicBtn.textContent = '🔇 Tap to Unmute Song';
      } else {
        musicBtn.textContent = '🔊 Song Playing ♪';
      }
    }

    function unlockAudioOnGesture() {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        if (isMuted) {
          ytPlayer.unMute();
          ytPlayer.setVolume(80);
          isMuted = false;
        }
        if (!isPlaying) {
          ytPlayer.playVideo();
          isPlaying = true;
        }
        updateMusicLabel();
      }
    }

    ['pointerdown', 'keydown', 'touchstart'].forEach((evt) => {
      window.addEventListener(evt, unlockAudioOnGesture, { once: true });
    });

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
      if (isMuted) {
        ytPlayer.unMute();
        ytPlayer.setVolume(80);
        ytPlayer.playVideo();
        isMuted = false;
        isPlaying = true;
      } else if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
      }
      updateMusicLabel();
    });

    // =========================================================
    // 3. HIGH-DENSITY 3D ASCII BOUQUET ENGINE
    // =========================================================
    const canvasEl = document.getElementById('ascii-canvas');
    const stageEl = document.getElementById('stage');

    const W = 276;
    const H = 200;
    const TOTAL = W * H;

    const zBuffer = new Float32Array(TOTAL);
    const charBuffer = new Array(TOTAL);
    const colorBuffer = new Array(TOTAL);

    // Pre-build the 3D point cloud of the bouquet
    const points = [];

    function addPoint(x, y, z, nx, ny, nz, ch, r, g, b, emissive = 0) {
      points.push({ x, y, z, nx, ny, nz, ch, r, g, b, emissive });
    }

    // Deterministic pseudo-random helper for rich organic detail
    let seed = 1337;
    function rand() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    // ---------------------------------------------------------
    // A. LOW-CUT FRONT / FLARED BACK WRAPPING PAPER & RIBBONS
    // ---------------------------------------------------------
    (function buildWrapping() {
      // Fan-shaped back & side sheets (tall behind, sweeping down in front so flowers pop out!)
      const sheetCount = 13;
      for (let s = 0; s < sheetCount; s++) {
        const t = (s / (sheetCount - 1)) * 2 - 1; // -1 to 1 across back arc
        const baseAngle = Math.PI + t * 1.48; // centered around back (z < 0)
        const isFrost = s % 2 === 1;
        const rCol = isFrost ? 205 : 68;
        const gCol = isFrost ? 225 : 108;
        const bCol = isFrost ? 245 : 148;

        const sheetTopY = 17.5 - Math.abs(t) * 6.5 + (s % 3) * 1.1;
        const sheetBotY = -12.0;

        for (let u = 0; u <= 34; u++) {
          const uf = u / 34; // 0 bottom -> 1 top
          const y = sheetBotY + uf * (sheetTopY - sheetBotY);
          // Flare outward as it rises
          const rad = 4.2 + Math.pow(uf, 1.15) * 12.6 + (s % 2) * 0.45;
          const span = 0.24 + uf * 0.16;

          for (let v = -10; v <= 10; v++) {
            const vf = v / 10;
            const ang = baseAngle + vf * span;
            // Crinkle wave
            const crinkle = Math.sin(vf * Math.PI * 2 + s) * 0.35 * uf;
            const rr = rad + crinkle;
            const x = Math.sin(ang) * rr;
            const z = Math.cos(ang) * rr - 1.2;

            const isEdge = Math.abs(v) >= 9 || u === 34;
            const ch = isEdge ? '/' : isFrost ? '+' : '#';
            const boost = isEdge ? 35 : 0;
            addPoint(
              x, y, z,
              Math.sin(ang), 0.25, Math.cos(ang),
              ch,
              Math.min(255, rCol + boost),
              Math.min(255, gCol + boost),
              Math.min(255, bCol + boost),
              isEdge ? 0.25 : 0
            );
          }
        }
      }

      // Low-cut front collar wrap (dips low in front so flowers burst over the edge)
      for (let i = 0; i < 160; i++) {
        const ang = (i / 160) * Math.PI * 2;
        const frontFactor = Math.max(0, Math.cos(ang)); // 1 at front (z > 0)
        const topY = 2.6 - frontFactor * 4.4; // dips down to y = -1.8 in front!
        const botY = -11.5;

        for (let j = 0; j <= 22; j++) {
          const jf = j / 22;
          const y = botY + jf * (topY - botY);
          const fold = Math.sin(ang * 9) * 0.45 * jf;
          const rad = 3.6 + Math.pow(jf, 1.1) * 7.8 + fold;
          const x = Math.sin(ang) * rad;
          const z = Math.cos(ang) * rad;

          const isRim = j >= 20;
          addPoint(
            x, y, z,
            Math.sin(ang), 0.15, Math.cos(ang),
            isRim ? '=' : '%',
            isRim ? 235 : 74,
            isRim ? 245 : 116,
            isRim ? 255 : 158,
            isRim ? 0.3 : 0
          );
        }
      }

      // Billowing white organza tulle ruffle collar around waist
      for (let i = 0; i < 240; i++) {
        const ang = (i / 240) * Math.PI * 2;
        const frontDip = Math.max(0, Math.cos(ang)) * 2.8;
        const waveY = Math.sin(ang * 11) * 1.1 - 2.6 - frontDip;
        const baseR = 8.4 + Math.cos(ang * 7) * 1.1;

        for (let k = 0; k < 7; k++) {
          const kf = k / 6;
          const r = baseR + kf * 2.4;
          const y = waveY + Math.sin(kf * Math.PI) * 1.3;
          const x = Math.sin(ang) * r;
          const z = Math.cos(ang) * r + 0.6;
          addPoint(x, y, z, Math.sin(ang), 0.5, Math.cos(ang), '~', 238, 246, 255, 0.25);
        }
      }

      // Flared lower wrap skirt
      for (let i = 0; i < 140; i++) {
        const ang = (i / 140) * Math.PI * 2;
        const isStripe = i % 14 < 4;
        for (let j = 0; j <= 18; j++) {
          const jf = j / 18;
          const y = -10.5 - jf * 9.5;
          const rad = 3.5 + jf * 3.8 + Math.sin(ang * 10) * 0.25;
          const x = Math.sin(ang) * rad;
          const z = Math.cos(ang) * rad;
          addPoint(
            x, y, z,
            Math.sin(ang), -0.2, Math.cos(ang),
            isStripe ? ':' : '#',
            isStripe ? 185 : 58,
            isStripe ? 210 : 94,
            isStripe ? 235 : 134
          );
        }
      }

      // Flowing white satin & gold-edged ribbons at the front waist
      for (let strand = -2; strand <= 2; strand++) {
        if (strand === 0) continue;
        const startAng = strand * 0.22;
        for (let t = 0; t <= 36; t++) {
          const tf = t / 36;
          const y = -7.5 - tf * 11.5;
          const sway = Math.sin(tf * 4.5 + strand) * 0.9 + strand * (0.6 + tf * 1.4);
          const z = 5.4 + tf * 2.1 + Math.cos(tf * 3) * 0.4;
          for (let w = -1; w <= 1; w++) {
            const isGoldEdge = Math.abs(w) === 1 && Math.abs(strand) === 2;
            addPoint(
              sway + w * 0.28 + Math.sin(startAng) * 2.2,
              y,
              z,
              0, 0.1, 1,
              isGoldEdge ? '*' : '|',
              isGoldEdge ? 250 : 245,
              isGoldEdge ? 210 : 249,
              isGoldEdge ? 110 : 255,
              0.3
            );
          }
        }
      }

      // Tucked gift card with mini golden clothespin on upper-right back
      const cardCenter = { x: 6.4, y: 12.6, z: -4.2 };
      for (let cx = -2.2; cx <= 2.2; cx += 0.35) {
        for (let cy = -3.0; cy <= 3.0; cy += 0.35) {
          const rotZ = -0.24;
          const rx = cx * Math.cos(rotZ) - cy * Math.sin(rotZ);
          const ry = cx * Math.sin(rotZ) + cy * Math.cos(rotZ);
          const isBorder = Math.abs(cx) > 1.85 || Math.abs(cy) > 2.65;
          addPoint(
            cardCenter.x + rx,
            cardCenter.y + ry,
            cardCenter.z + ry * 0.18,
            0.2, 0.2, 0.95,
            isBorder ? '*' : '.',
            isBorder ? 245 : 244,
            isBorder ? 204 : 247,
            isBorder ? 105 : 252,
            0.35
          );
        }
      }
    })();

    // ---------------------------------------------------------
    // C. FLOWER GENERATORS (Roses, Peonies, Ranunculus, Gold)
    // ---------------------------------------------------------
    function buildRose(cx, cy, cz, nx, ny, nz, radius, palette) {
      // Create orthonormal basis pointing along normal (nx, ny, nz)
      const len = Math.hypot(nx, ny, nz) || 1;
      const ux = nx / len, uy = ny / len, uz = nz / len;
      const upX = Math.abs(uy) > 0.9 ? 1 : 0;
      const upY = Math.abs(uy) > 0.9 ? 0 : 1;
      const upZ = 0;

      // right = up x u
      let rx = upY * uz - upZ * uy;
      let ry = upZ * ux - upX * uz;
      let rz = upX * uy - upY * ux;
      const rLen = Math.hypot(rx, ry, rz) || 1;
      rx /= rLen; ry /= rLen; rz /= rLen;

      // forward = u x right
      const fx = uy * rz - uz * ry;
      const fy = uz * rx - ux * rz;
      const fz = ux * ry - uy * rx;

      const rings = 10;
      for (let ring = 0; ring < rings; ring++) {
        const rf = ring / (rings - 1); // 0 center -> 1 outer petal rim
        const ringRad = (0.14 + rf * 0.86) * radius;
        const ptsInRing = Math.max(8, Math.floor(16 + rf * 40));
        const cupHeight = (1 - Math.pow(rf, 1.45)) * radius * 0.62;

        for (let p = 0; p < ptsInRing; p++) {
          const theta = (p / ptsInRing) * Math.PI * 2 + ring * 0.65;
          const petalWave = 1 + 0.16 * Math.sin(theta * (3 + (ring % 3)) + ring);
          const localR = ringRad * petalWave;

          const lx = Math.cos(theta) * localR;
          const ly = Math.sin(theta) * localR;
          const lz = cupHeight + Math.sin(theta * 5) * 0.14 * rf;

          const wx = cx + rx * lx + fx * ly + ux * lz;
          const wy = cy + ry * lx + fy * ly + uy * lz;
          const wz = cz + rz * lx + fz * ly + uz * lz;

          // Color gradient from deep center to luminous rim
          let col;
          let ch = '@';
          let em = 0.08;
          if (rf < 0.28) {
            col = palette.core;
            ch = '@';
          } else if (rf < 0.72) {
            col = palette.mid;
            ch = '0';
          } else {
            col = palette.rim;
            ch = 'o';
            em = 0.22;
          }

          addPoint(
            wx, wy, wz,
            ux * 0.7 + (rx * Math.cos(theta) + fx * Math.sin(theta)) * 0.5,
            uy * 0.7 + (ry * Math.cos(theta) + fy * Math.sin(theta)) * 0.5,
            uz * 0.7 + (rz * Math.cos(theta) + fz * Math.sin(theta)) * 0.5,
            ch,
            col[0], col[1], col[2],
            em
          );
        }
      }
    }

    function buildPeony(cx, cy, cz, nx, ny, nz, radius) {
      const len = Math.hypot(nx, ny, nz) || 1;
      const ux = nx / len, uy = ny / len, uz = nz / len;
      for (let i = 0; i < 220; i++) {
        const phi = Math.acos(1 - (i / 220) * 1.15);
        const theta = i * 2.39996; // golden angle
        const ruffle = 1 + 0.22 * Math.sin(theta * 6) * Math.sin(phi * 4);
        const r = radius * ruffle;

        const sx = Math.sin(phi) * Math.cos(theta) * r;
        const sy = Math.sin(phi) * Math.sin(theta) * r;
        const sz = Math.cos(phi) * r * 0.75;

        const isGoldCore = phi < 0.36;
        addPoint(
          cx + sx + ux * 0.5,
          cy + sy + uy * 0.5,
          cz + sz + uz * 0.5,
          sx / r, sy / r, sz / r,
          isGoldCore ? '*' : '8',
          isGoldCore ? 252 : 248,
          isGoldCore ? 211 : 244,
          isGoldCore ? 77 : 234,
          isGoldCore ? 0.45 : 0.2
        );
      }
    }

    // ---------------------------------------------------------
    // C. POPULATE 48 POPPED-OUT BLOOMS OVER THE LOW FRONT WRAP
    // ---------------------------------------------------------
    const palettes = {
      skyWhite: {
        core: [14, 95, 195],
        mid: [56, 178, 248],
        rim: [232, 246, 255]
      },
      royalIce: {
        core: [22, 62, 168],
        mid: [48, 128, 232],
        rim: [204, 234, 255]
      },
      creamGold: {
        core: [218, 165, 55],
        mid: [248, 235, 198],
        rim: [255, 252, 242]
      },
      periwinkle: {
        core: [67, 88, 198],
        mid: [129, 152, 248],
        rim: [236, 242, 255]
      }
    };

    // Build an abundant 3D dome of 48 flowers bursting forward in front (+Z) and all around
    const totalFlowers = 48;
    for (let i = 0; i < totalFlowers; i++) {
      const t = i / totalFlowers;
      // Golden spiral across a lush forward-bulging dome
      const goldenAngle = i * 2.3999632;
      const polar = Math.acos(1 - t * 1.18); // reaches past equator so flowers spill over the low front wrap!

      const domeRx = 11.4;
      const domeRy = 11.8;
      const domeRz = 11.6;

      let x = Math.sin(polar) * Math.cos(goldenAngle) * domeRx;
      let z = Math.sin(polar) * Math.sin(goldenAngle) * domeRz;
      let y = Math.cos(polar) * domeRy + 4.4;

      // Push front blooms forward so they visibly pop out of the wrap
      if (z > 0) {
        z += 2.2 * Math.cos((y - 4.4) / 14);
        y -= 1.3;
      }

      // Each stem begins directly beneath its flower head and gathers
      // inside the paper wrap. No stem extends below the wrapped bouquet.
      const stemEndX = x * 0.18;
      const stemEndZ = z * 0.18;
      const stemTopY = y - 1.25;
      const stemBottomY = -9.2;
      for (let j = 0; j <= 30; j++) {
        const st = j / 30;
        const sx = x + (stemEndX - x) * st + Math.sin(st * 4 + i) * 0.12;
        const sy = stemTopY + (stemBottomY - stemTopY) * st;
        const sz = z + (stemEndZ - z) * st;
        addPoint(sx, sy, sz, 0.08, 1, 0.04, '|',
          38 + (i % 3) * 7, 112 + (i % 4) * 8, 55 + (i % 3) * 6, 0.06);

        // Small leaves stay close to the stem and within the wrap.
        if (j > 5 && j < 25 && j % 7 === 0) {
          const side = ((j / 7 + i) % 2 === 0) ? 1 : -1;
          const leafX = sx + side * 0.65;
          const leafY = sy + 0.28;
          const leafZ = sz + Math.cos(goldenAngle) * 0.28;
          addPoint(leafX, leafY, leafZ, side * 0.5, 0.5, 0.2,
            '/', 76, 145, 78, 0.10);
          addPoint(leafX + side * 0.24, leafY + 0.12, leafZ,
            side * 0.7, 0.3, 0.1, '♦', 104, 166, 91, 0.12);
        }
      }

      const rPick = i % 7;
      if (rPick === 2 || rPick === 5) {
        buildPeony(x, y, z, x, y - 1, z + 3, 2.05);
      } else {
        const pal =
          rPick === 0 || rPick === 3
            ? palettes.skyWhite
            : rPick === 1 || rPick === 4
            ? palettes.royalIce
            : rPick === 6
            ? palettes.creamGold
            : palettes.periwinkle;
        const size = 2.05 + (i % 3) * 0.25;
        buildRose(x, y, z, x, y - 0.5, z + 3.5, size, pal);
      }
    }

    // A compact gathered stem base, kept fully inside the wrapping.
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      for (let j = 0; j <= 10; j++) {
        const t = j / 10;
        const r = 1.2 + t * 1.0;
        addPoint(Math.cos(a) * r, -8.1 - t * 1.1,
          Math.sin(a) * r, Math.cos(a), 0.2, Math.sin(a),
          '|', 48, 120, 62, 0.06);
      }
    }

    // ---------------------------------------------------------
    // D. 5 DETAILED 3D KINDER BUENO BARS TUCKED IN THE BOUQUET
    // ---------------------------------------------------------
    function buildKinderBueno(cx, cy, cz, tiltZ, tiltX, yawY) {
      // Bar dimensions: width 2.6, height 6.4, thickness 1.1
      const cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);
      const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
      const cosY = Math.cos(yawY), sinY = Math.sin(yawY);

      function transform(lx, ly, lz) {
        // Rotate Z
        let x1 = lx * cosZ - ly * sinZ;
        let y1 = lx * sinZ + ly * cosZ;
        let z1 = lz;
        // Rotate X
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;
        let x2 = x1;
        // Rotate Y
        let x3 = x2 * cosY + z2 * sinY;
        let z3 = -x2 * sinY + z2 * cosY;
        return [cx + x3, cy + y2, cz + z3];
      }

      for (let lx = -1.25; lx <= 1.25; lx += 0.22) {
        for (let ly = -3.1; ly <= 3.1; ly += 0.22) {
          for (let side of [-1, 1]) {
            const lz = side * 0.52;
            const [wx, wy, wz] = transform(lx, ly, lz);

            // Signature Kinder Bueno styling:
            // Top crimp & bottom crimp: silver-white foil
            // Upper half: glossy white wrapper with red "Kinder" stripe
            // Lower half: rich milk-chocolate wafer segments with hazelnut drizzle!
            let r = 250, g = 250, b = 252, ch = '#', em = 0.25;

            if (Math.abs(ly) > 2.75) {
              // Crimped silver-white wrapper ends
              r = 225; g = 232; b = 240; ch = '=';
            } else if (ly > 0.35) {
              // Classic white wrapper with bold red brand band
              if (ly > 1.15 && ly < 2.05 && Math.abs(lx) < 0.95) {
                r = 228; g = 34; b = 42; ch = 'B'; em = 0.32; // Kinder red accent
              } else {
                r = 252; g = 252; b = 255; ch = '#'; em = 0.28;
              }
            } else {
              // Exposed crispy chocolate-coated hazelnut wafer bar!
              const ridge = Math.sin(ly * 5.2) * 0.5 + 0.5;
              const drizzle = Math.sin(lx * 7 + ly * 4) > 0.65;
              if (drizzle) {
                r = 62; g = 32; b = 18; ch = '~'; // Dark chocolate drizzle
              } else {
                r = Math.floor(138 + ridge * 38);
                g = Math.floor(82 + ridge * 26);
                b = Math.floor(44 + ridge * 16);
                ch = ridge > 0.5 ? 'W' : 'w';
              }
              em = 0.12;
            }

            addPoint(wx, wy, wz, 0, 0.2, side, ch, r, g, b, em);
          }
        }
      }
    }

    // Place 5 Kinder Bueno bars artfully angled among the front & upper blooms
    buildKinderBueno(-5.4, 8.6, 8.6, 0.36, -0.25, -0.35);
    buildKinderBueno(5.2, 9.2, 8.2, -0.34, -0.24, 0.35);
    buildKinderBueno(0.1, 11.4, 7.6, 0.06, -0.32, 0.0);
    buildKinderBueno(-7.6, 3.2, 8.4, 0.52, -0.15, -0.58);
    buildKinderBueno(7.4, 3.5, 8.2, -0.48, -0.15, 0.58);

    // ---------------------------------------------------------
    // E. BABY'S BREATH CLOUDS & SHIMMERING GOLD FOLIAGE SPRIGS
    // ---------------------------------------------------------
    (function buildFillersAndGold() {
      // Dense snowy baby's breath clusters tucked between every bloom
      for (let i = 0; i < 4200; i++) {
        const u = rand();
        const v = rand();
        const theta = u * Math.PI * 2;
        const phi = Math.acos(1 - v * 1.15);
        const rad = 10.6 + rand() * 3.2;

        let x = Math.sin(phi) * Math.cos(theta) * rad;
        let z = Math.sin(phi) * Math.sin(theta) * rad;
        let y = Math.cos(phi) * rad + 4.5;
        if (z > 0) z += 1.5;

        const isGoldDust = i % 9 === 0;
        addPoint(
          x, y, z,
          x / rad, y / rad, z / rad,
          isGoldDust ? '✦' : i % 2 === 0 ? '·' : '°',
          isGoldDust ? 255 : 244,
          isGoldDust ? 215 : 250,
          isGoldDust ? 95 : 255,
          isGoldDust ? 0.55 : 0.3
        );
      }

      // 18 Metallic Gold Eucalyptus & Fern Sprigs radiating around & through the bouquet
      const sprigCount = 18;
      for (let s = 0; s < sprigCount; s++) {
        const ang = (s / sprigCount) * Math.PI * 2;
        const elevation = 0.25 + (s % 4) * 0.24;
        for (let step = 0; step < 14; step++) {
          const dist = 7.5 + step * 0.58;
          const x = Math.sin(ang) * Math.cos(elevation) * dist;
          const z = Math.cos(ang) * Math.cos(elevation) * dist + (Math.cos(ang) > 0 ? 1.4 : 0);
          const y = 3.8 + Math.sin(elevation) * dist + Math.sin(step * 0.4) * 0.5;

          // Stem + alternating gold leaves
          addPoint(x, y, z, 0, 1, 0, '/', 235, 185, 65, 0.45);
          if (step > 2) {
            const side = step % 2 === 0 ? 1 : -1;
            const lx = x + Math.cos(ang) * side * 0.75;
            const lz = z - Math.sin(ang) * side * 0.75;
            addPoint(lx, y + 0.25, lz, 0, 1, 0, '♦', 255, 218, 98, 0.55);
          }
        }
      }
    })();

    // =========================================================
    // 4. REAL-TIME 3D Z-BUFFERED ASCII RENDERER
    // =========================================================
    let angleY = 0.18;
    let angleX = -0.10; // vertical viewing angle; drag up/down to look over/under the bouquet
    let isSpinning = true;
    let speedMult = 1;
    let zoomMult = 1;
    let isDragging = false;
    let lastClientX = 0;
    let lastClientY = 0;
    let velocityY = 0;
    let velocityX = 0;

    const camDist = 64;
    const fovX = 195;
    const fovY = 104;

    // Key light direction (front-top-right)
    const lx = 0.42, ly = 0.65, lz = 0.63;

    function renderFrame() {
      zBuffer.fill(-1e9);
      charBuffer.fill(' ');
      colorBuffer.fill('');

      const cosA = Math.cos(angleY);
      const sinA = Math.sin(angleY);
      const scale = zoomMult;

      for (let i = 0; i < points.length; i++) {
        const p = points[i];

        // Rotate around Y (horizontal drag), then X (vertical drag).
        const xYaw = p.x * cosA + p.z * sinA;
        const zYaw = -p.x * sinA + p.z * cosA;
        const yBase = p.y - 1.5; // center bouquet vertically
        const cosX = Math.cos(angleX);
        const sinX = Math.sin(angleX);
        const ry = yBase * cosX - zYaw * sinX;
        const rz = yBase * sinX + zYaw * cosX;
        const rx = xYaw;

        const depth = camDist - rz;
        if (depth <= 4) continue;

        const invZ = (1 / depth) * scale;
        const sx = Math.floor(W * 0.5 + rx * fovX * invZ);
        const sy = Math.floor(H * 0.52 - ry * fovY * invZ);

        if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;

        const idx = sy * W + sx;
        if (rz > zBuffer[idx]) {
          zBuffer[idx] = rz;

          // Rotate normal for directional lighting
          const nxYaw = p.nx * cosA + p.nz * sinA;
          const nzYaw = -p.nx * sinA + p.nz * cosA;
          const rnx = nxYaw;
          const rny = p.ny * cosX - nzYaw * sinX;
          const rnz = p.ny * sinX + nzYaw * cosX;

          const diff = Math.max(0, rnx * lx + rny * ly + rnz * lz);
          const shade = Math.min(1.25, 0.48 + diff * 0.68 + p.emissive);

          const cr = Math.min(255, Math.floor(p.r * shade));
          const cg = Math.min(255, Math.floor(p.g * shade));
          const cb = Math.min(255, Math.floor(p.b * shade));

          charBuffer[idx] = p.ch;
          colorBuffer[idx] = `rgb(${cr},${cg},${cb})`;
        }
      }

      // Build colored HTML rows efficiently with span run-length batching
      let out = '';
      for (let y = 0; y < H; y++) {
        const rowOffset = y * W;
        let currentColor = '';
        let run = '';

        for (let x = 0; x < W; x++) {
          const idx = rowOffset + x;
          const ch = charBuffer[idx];
          const col = colorBuffer[idx];

          if (col !== currentColor) {
            if (run.length > 0) {
              out += currentColor ? `<span style="color:${currentColor}">${run}</span>` : run;
              run = '';
            }
            currentColor = col;
          }
          run += ch;
        }
        if (run.length > 0) {
          out += currentColor ? `<span style="color:${currentColor}">${run}</span>` : run;
        }
        out += '\n';
      }

      canvasEl.innerHTML = out;
    }

    function animate() {
      if (!isDragging) {
        if (isSpinning) {
          angleY += 0.014 * speedMult;
        } else {
          if (Math.abs(velocityY) > 0.0002) {
            angleY += velocityY;
            velocityY *= 0.94;
          }
          if (Math.abs(velocityX) > 0.0002) {
            angleX += velocityX;
            velocityX *= 0.94;
            angleX = Math.max(-Math.PI * 0.48, Math.min(Math.PI * 0.48, angleX));
          }
        }
      }
      renderFrame();
      requestAnimationFrame(animate);
    }

    // =========================================================
    // 5. INTERACTIVE CONTROLS & DRAG TO SPIN
    // =========================================================
    stageEl.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastClientX = e.clientX;
      lastClientY = e.clientY;
      velocityY = 0;
      velocityX = 0;
      if (stageEl.setPointerCapture) stageEl.setPointerCapture(e.pointerId);
    });

    stageEl.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastClientX;
      const dy = e.clientY - lastClientY;
      lastClientX = e.clientX;
      lastClientY = e.clientY;
      velocityY = dx * 0.0085;
      velocityX = dy * 0.007;
      angleY += velocityY;
      angleX = Math.max(-Math.PI * 0.48, Math.min(Math.PI * 0.48, angleX + velocityX));
    });

    stageEl.addEventListener('pointerup', () => {
      isDragging = false;
    });
    stageEl.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    const toggleSpinBtn = document.getElementById('toggle-spin');
    toggleSpinBtn.addEventListener('click', () => {
      isSpinning = !isSpinning;
      toggleSpinBtn.textContent = isSpinning ? '⏸ Pause' : '▶ Spin';
    });

    const speedBtn = document.getElementById('speed-btn');
    const speeds = [1, 1.8, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      speedMult = speeds[speedIdx];
      speedBtn.textContent = `Speed: ${speedMult}x`;
    });

    const zoomBtn = document.getElementById('zoom-btn');
    zoomBtn.addEventListener('click', () => {
      zoomMult = zoomMult === 1 ? 1.28 : 1;
      zoomBtn.textContent = `Zoom: ${zoomMult === 1 ? '1x' : '1.3x'}`;
    });

    // Start loop
    animate();
  </script>
</body>
